services:
  web:
    build: .
    image: exhibition-credit-review:latest
    container_name: exhibition-credit-review
    ports:
      - "8000:8000"
    environment:
      CREDIT_DB_PATH: /data/credit.db
      FLASK_SECRET_KEY: change-me-in-production
    volumes:
      - credit-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  credit-data:
